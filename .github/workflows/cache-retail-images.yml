name: Cache Retail card artwork locally
on:
  push:
    paths:
      - scripts/cache-retail-images.py
      - .github/workflows/cache-retail-images.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate Retail images
        run: python scripts/cache-retail-images.py
      - name: Commit locally hosted images
        run: |
          if git diff --quiet -- v3/retail-printings.json && [ -z "$(git ls-files --others --exclude-standard v3/retail-art)" ]; then
            echo "No new assets"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3/retail-printings.json v3/retail-art
          git commit -m "assets(v3): host verified Retail card images on GitHub Pages"
          git pull --rebase origin main
          git push origin HEAD:main
