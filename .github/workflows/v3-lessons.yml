name: V3 beginner lesson acceptance
on:
  push:
    branches: [main]
    paths:
      - 'v3/trainer-modules.js'
      - 'v3/battle-actions.js'
      - 'v3/mirror-combat.js'
      - 'v3/heist-effects.js'
      - 'v3/turn-practice.js'
      - 'v3/turn-practice-ui.js'
      - 'v3/site.css'
      - 'v3/style-order.css'
      - 'v3/table-layout.css'
      - 'v3/table-theme.css'
      - 'v3/design-system.css'
      - 'tests/v3-design-system.test.js'
      - 'v3/practice-guide.js'
      - 'v3/card-reference.js'
      - 'v3/dice-animation.js'
      - 'v3/dice-animation.css'
      - 'v3/heist-practice.js'
      - 'v3/embracing-practice.js'
      - 'v3/starter-match.js'
      - 'tests/v3-starter-match.test.js'
      - 'v3/embracing-reference.js'
      - 'tests/v3-embracing.test.js'
      - 'v3/index.html'
      - 'rules-core.js'
      - 'localization.js'
      - 'official-cards.js'
      - 'starter-decks.js'
      - 'beta-cards.json'
      - 'tests/v3-lessons.test.js'
      - 'tests/v3-turn-practice.test.js'
      - 'tests/v3-heist-practice.test.js'
      - 'tests/v3-practice-guide.test.js'
      - 'tests/v3-card-reference.test.js'
      - 'tests/v3-mirror-combat.test.js'
      - 'tests/v3-heist-effects.test.js'
      - 'tests/v3-spend-effects.test.js'
      - 'tests/v3-opening.test.js'
      - 'tests/v3-opening-matrix.test.js'
      - 'tests/v3-opening-matrix.browser.cjs'
      - 'tests/v3-outcomes.test.js'
      - 'tests/v3-full-match.test.js'
      - 'tests/v3-ai-strategy.test.js'
      - 'tests/v3-ai-programs.test.js'
      - '.github/workflows/v3-lessons.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify shared mechanics
        run: node tests/rules-core.test.js
      - name: Verify V3 twelve lessons and card names
        run: node tests/v3-lessons.test.js
      - name: Verify V3 basic turn practice
        run: node tests/v3-turn-practice.test.js
      - name: Check V3 browser scripts parse
        run: |
          node --check v3/turn-practice-ui.js
          node --check v3/mirror-combat.js
          node --check v3/heist-effects.js
          node --check v3/dice-animation.js
          node --check v3/heist-practice.js
          node --check v3/embracing-practice.js
          node --check v3/starter-match.js
          node --check v3/embracing-reference.js
          node --check v3/turn-practice.js
      - name: Verify The Heist real-card payment practice
        run: node tests/v3-heist-practice.test.js

      - name: Verify state-driven tabletop guidance
        run: node tests/v3-practice-guide.test.js
      - name: Verify mirror combat and defensive reactions
        run: node tests/v3-mirror-combat.test.js
      - name: Verify Legend and The Heist effects
        run: node tests/v3-heist-effects.test.js
      - name: Verify spend-triggered Gear choices
        run: node tests/v3-spend-effects.test.js
      - name: Verify shuffled opening and one-time Mulligan
        run: node tests/v3-opening.test.js
      - name: Verify 1600 opening flows across all four starter matchups
        run: node tests/v3-opening-matrix.test.js
      - name: Verify Overtime and match outcomes
        run: node tests/v3-outcomes.test.js
      - name: Verify 100 complete seeded desktop match state flows
        run: node tests/v3-full-match.test.js
      - name: Verify Embracing Power abilities and timing
        run: node tests/v3-embracing.test.js
      - name: Verify 100 complete Embracing Power matches
        run: V3_TEST_DECK=embracingPower node tests/v3-full-match.test.js
      - name: Verify active mirror Call, Go Solo and Gear decisions
        run: node tests/v3-ai-strategy.test.js
      - name: Verify AI main Programs and defensive Call
        run: node tests/v3-ai-programs.test.js

      - name: Verify The Heist display reference coverage and card versions
        run: node tests/v3-card-reference.test.js

      - name: Verify cross-deck composition and interactions
        run: node tests/v3-starter-match.test.js
      - name: Verify 100 Heist vs Embracing Power matches
        run: V3_OPPONENT_DECK=embracingPower node tests/v3-full-match.test.js
      - name: Verify 100 Embracing Power vs Heist matches
        run: V3_TEST_DECK=embracingPower V3_OPPONENT_DECK=theHeist node tests/v3-full-match.test.js

      - name: Verify V3 shared typography and CSS priority policy
        run: node tests/v3-design-system.test.js
